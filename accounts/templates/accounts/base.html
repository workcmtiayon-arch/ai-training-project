{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Comptes{% endblock %} · AI Chat Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-screen bg-blue-50 text-slate-800">
  <main class="mx-auto flex min-h-screen max-w-md items-center px-4 py-10">
    <section class="w-full rounded-2xl border border-blue-100 bg-white p-6 shadow-sm sm:p-8">
      <a href="{% url 'chat_page' %}" class="text-xs font-semibold uppercase tracking-[0.2em] text-blue-700">AI Chat Lab</a>
      {% block content %}{% endblock %}
    </section>
  </main>
</body>
</html>
