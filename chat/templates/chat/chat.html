{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="min-h-screen bg-blue-50 text-slate-800 lg:h-screen lg:overflow-hidden" data-task-list-url="{% url 'task_list' %}" data-task-create-url="{% url 'task_create' %}" data-chat-url="{% url 'send_message' %}">
  <main class="mx-auto flex min-h-screen w-full flex-col px-4 sm:px-8 lg:h-screen lg:max-h-screen lg:px-10 xl:px-12">
    <header class="flex-none border-b border-blue-100 py-5">
      <!-- <p class="text-xs font-semibold uppercase tracking-[0.25em] text-blue-700">AI Chat Lab</p>
      <h1 class="mt-1 text-2xl font-semibold text-slate-900">Votre assistant IA</h1>
      <p class="mt-1 text-sm text-slate-500">Discutez avec Gemini et organisez vos prochaines actions.</p> -->
    </header>

    <div class="grid min-h-0 flex-1 gap-6 py-5 lg:h-[calc(100vh-105px)] lg:grid-cols-[minmax(0,1fr)_460px] xl:grid-cols-[minmax(0,1fr)_520px]">
      <section class="flex min-h-0 flex-col overflow-hidden rounded-2xl border border-blue-100 bg-white">
        <div id="messages" class="min-h-0 flex-1 space-y-4 overflow-y-auto p-5" aria-live="polite">
          {% for message in messages %}
            <div class="flex {% if message.role == 'user' %}justify-end{% else %}justify-start{% endif %}">
              <div class="max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-6 {% if message.role == 'user' %}rounded-br-sm bg-blue-600 text-white{% else %}rounded-bl-sm bg-blue-50 text-slate-700{% endif %}">{{ message.content|linebreaksbr }}</div>
            </div>
          {% empty %}
            <div id="empty-state" class="flex h-full min-h-64 items-center justify-center text-center text-sm text-slate-400">Commencez la conversation en bas de l’écran.</div>
          {% endfor %}
        </div>
        <form id="chat-form" class="border-t border-blue-100 bg-white p-4">
          {% csrf_token %}
          <div class="flex items-end gap-3 rounded-xl border border-blue-200 bg-blue-50 p-2 focus-within:border-blue-600">
            <textarea id="message-input" rows="1" maxlength="2000" required placeholder="Écrivez votre message…" class="max-h-32 flex-1 resize-none bg-transparent px-3 py-2 text-sm outline-none placeholder:text-slate-400"></textarea>
            <button id="send-button" type="submit" class="rounded-lg bg-blue-700 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-50">Envoyer</button>
          </div>
          <p id="status" class="mt-2 h-5 text-center text-xs text-slate-500"></p>
        </form>
      </section>

      <aside class="flex min-h-0 flex-col overflow-hidden rounded-2xl border border-blue-100 bg-white">
        <div class="flex items-center justify-between border-b border-blue-100 px-4 py-4">
          <div><h2 class="font-semibold text-slate-900">Mes tâches</h2><p class="text-xs text-slate-400">Votre espace de travail</p></div>
          <button id="refresh-tasks" type="button" class="rounded-lg px-2 py-1 text-blue-700 hover:bg-blue-50" title="Actualiser">↻</button>
        </div>
        <div id="task-list" class="flex-1 space-y-2 overflow-y-auto p-3"><p class="p-3 text-sm text-slate-400">Chargement…</p></div>
        <form id="task-form" class="border-t border-blue-100 p-3">
          <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Nouvelle tâche</p>
          <input id="task-title" required maxlength="120" placeholder="Titre" class="mb-2 w-full rounded-lg border border-blue-200 px-3 py-2 text-sm outline-none focus:border-blue-600">
          <textarea id="task-description" maxlength="2000" rows="2" placeholder="Description (optionnel)" class="mb-2 w-full resize-none rounded-lg border border-blue-200 px-3 py-2 text-sm outline-none focus:border-blue-600"></textarea>
          <div class="flex gap-2">
            <select id="task-priority" class="flex-1 rounded-lg border border-blue-200 px-2 py-2 text-sm outline-none focus:border-blue-600"><option value="medium">Priorité moyenne</option><option value="high">Priorité haute</option><option value="low">Priorité basse</option></select>
            <button class="rounded-lg bg-blue-700 px-3 py-2 text-sm font-semibold text-white hover:bg-blue-800" type="submit">+</button>
          </div>
          <p id="task-status" class="mt-2 text-xs text-rose-500"></p>
        </form>
      </aside>
    </div>
  </main>
  <script src="{% static 'js/chat.js' %}"></script>
</body>
</html>
